name: Verify white header and road idle
on:
  push:
    branches: [feat/road-idle-qa]
    paths: ['src/**', 'tools/**', 'build.py', '.github/workflows/road-idle.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and prepare verification
        run: |
          python3 build.py
          python3 tools/check-static.py
          npm install --prefix /tmp/hero-browser --no-save playwright@1.56.1
          google-chrome --version
      - name: Verify layouts and road-only idle playback
        env:
          PLAYWRIGHT_PATH: /tmp/hero-browser/node_modules/playwright
          HERO_QA_OUT: /tmp/hero-screenshots
        run: |
          node tools/dev-server.js 8766 > /tmp/hero-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent --fail http://localhost:8766/ > /dev/null
          node tools/hero-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-idle-verification
          path: /tmp/hero-screenshots
      - name: Commit verified site and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/road-idle.yml
          git add public
          git commit -m "Build verified pearl white header and road-only idle playback"
          git push
