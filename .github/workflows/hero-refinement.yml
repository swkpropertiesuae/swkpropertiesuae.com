name: Verify and build hero refinement
on:
  push:
    branches: [feat/hero-refinement-qa]
    paths: ['src/**', 'tools/**', 'build.py', '.github/workflows/hero-refinement.yml']
permissions:
  contents: write
concurrency:
  group: swk-hero-refinement
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --prefix /tmp/hero-browser --no-save playwright@1.56.1
          google-chrome --version
      - name: Build 4K delivery and site
        run: |
          git show 71beb036a15243c398e5b14dffe4226d5230fe0f:src/assets/video/hero-swk.mp4 > /tmp/hero-original.mp4
          bash tools/upscale-hero.sh /tmp/hero-original.mp4
          python3 tools/check-static.py
          node --check src/js/modules/40-hero.js
          ffmpeg -v error -i src/assets/video/hero-swk-4k.mp4 -f null -
      - name: Browser layout and playback verification
        env:
          PLAYWRIGHT_PATH: /tmp/hero-browser/node_modules/playwright
          HERO_QA_OUT: /tmp/hero-screenshots
        run: |
          node tools/dev-server.js 8766 > /tmp/hero-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent --fail http://localhost:8766/ > /dev/null
          node tools/hero-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-browser-verification
          path: /tmp/hero-screenshots
      - name: Commit verified assets and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hero-refinement.yml
          git add src/assets public
          git commit -m "Build verified 4K hero delivery and refined UI"
          git push
