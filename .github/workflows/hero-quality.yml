name: Master hero video
on:
  push:
    branches: [feat/hero-quality-master]
    paths:
      - tools/master-hero.sh
      - .github/workflows/hero-quality.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Rebuild video and static site
        run: |
          git show 71beb036a15243c398e5b14dffe4226d5230fe0f:src/assets/video/hero-swk.mp4 > /tmp/hero-original.mp4
          git rm src/assets/video/hero-swk.mp4 src/assets/images/hero/hero-swk-poster.webp
          bash tools/master-hero.sh /tmp/hero-original.mp4
          python3 tools/check-static.py
          node --check src/js/modules/40-hero.js
          ffmpeg -v error -i src/assets/video/hero-swk-hq.mp4 -f null -
      - name: Commit mastered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hero-quality.yml
          git add src/assets public
          git diff --cached --quiet && exit 0
          git commit -m "Build corrected high quality hero video and matching poster"
          git push
